<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin:0; padding:0; background:#f4f4f4; font-family:Arial,sans-serif; }
    .greeting { font-size:17px; font-weight:bold; color:#1a1a2e; margin:0 0 20px; }
    .btn { display:inline-block; padding:12px 28px; background:#f5c518; color:#1a1a2e; font-weight:bold; border-radius:5px; text-decoration:none; font-size:15px; }
  </style>
</head>
<body style="margin:0; padding:0; background:#f4f4f4; font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background:#f4f4f4;">
    <tr><td align="center" style="padding:40px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:100%; background:#ffffff; border-radius:8px; overflow:hidden;">
        <tr><td align="center" style="padding:28px 32px; background:#1a1a2e; color:#f5c518; font-size:22px; font-weight:bold; letter-spacing:1px;">
          ISKCON Ravet Youth Services
        </td></tr>
        <tr><td style="padding:32px; color:#333333; font-size:15px; line-height:1.7;">
          {% block content %}{% endblock %}
        </td></tr>
        {% block footer %}
        <tr><td align="center" style="padding:18px 32px; background:#f0f0f0; color:#666666; font-size:12px; line-height:1.6;">
          Hare Krishna! &nbsp;|&nbsp; IYS Team<br />
          <span style="font-size:11px; color:#888888;">This is an automated message. Please do not reply.</span>
        </td></tr>
        {% endblock %}
      </table>
    </td></tr>
  </table>
</body>
</html>
