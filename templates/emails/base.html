<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body { margin: 0; padding: 0; background: #f4f4f4; font-family: Arial, sans-serif; }
    .wrapper { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .header { background: #1a1a2e; padding: 28px 32px; text-align: center; }
    .header h1 { margin: 0; color: #f5c518; font-size: 22px; letter-spacing: 1px; }
    .body { padding: 32px; color: #333333; font-size: 15px; line-height: 1.7; }
    .body p { margin: 0 0 16px; }
    .btn { display: inline-block; margin: 20px 0; padding: 12px 28px; background: #f5c518; color: #1a1a2e; font-weight: bold; border-radius: 5px; text-decoration: none; font-size: 15px; }
    .footer { background: #f0f0f0; padding: 18px 32px; text-align: center; font-size: 12px; color: #888888; }
    .greeting { font-size: 17px; font-weight: bold; color: #1a1a2e; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>ISKCON Ravet Youth Services</h1>
    </div>
    <div class="body">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      Hare Krishna! &nbsp;|&nbsp; IYS Team<br/>
      <small>This is an automated message. Please do not reply.</small>
    </div>
  </div>
</body>
</html>
