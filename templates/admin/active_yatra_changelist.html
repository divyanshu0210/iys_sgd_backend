{% extends "admin/change_list.html" %}

{% block extra_admin_tools %}
  <form method="get">
      {% for key, value in request.GET.items %}
        {% if key != "show_all" %}
          <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endif %}
      {% endfor %}
      {% if show_all_yatras %}
        <input type="hidden" name="show_all" value="0">
        <button type="submit" class="button">Show active Yatras only</button>
      {% else %}
        <input type="hidden" name="show_all" value="1">
        <button type="submit" class="button">Show All</button>
      {% endif %}
  </form>
{% endblock %}
